<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
 layout:decorate="~{layout/base}">

<head>
 <title layout:title-append=" | Create Employee"></title>
 <th:block layout:fragment="custom-css">
 </th:block>
</head>

<body>

 <th:block layout:fragment="content">

  <div class="d-sm-flex align-items-center justify-content-between mb-4">
   <h1 class="h3 mb-0 text-gray-800">Create New Employee</h1>
   <a th:href="@{/admin/employees}" class="btn btn-secondary btn-icon-split">
    <span class="icon text-white-50">
     <i class="fas fa-arrow-left"></i>
    </span>
    <span class="text">Back to List</span>
   </a>
  </div>

  <!-- Alert Messages -->
  <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
   <i class="fas fa-check-circle"></i>
   <span th:text="${successMessage}"></span>
   <button type="button" class="close" data-dismiss="alert" aria-label="Close">
    <span aria-hidden="true">&times;</span>
   </button>
  </div>

  <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
   <i class="fas fa-exclamation-triangle"></i>
   <span th:text="${errorMessage}"></span>
   <button type="button" class="close" data-dismiss="alert" aria-label="Close">
    <span aria-hidden="true">&times;</span>
   </button>
  </div>

  <div class="row">
   <div class="col-lg-8 offset-lg-2">
    <div class="card shadow mb-4">
     <div class="card-header py-3">
      <h6 class="m-0 font-weight-bold text-primary">Employee Information</h6>
     </div>
     <div class="card-body">
      <form th:action="@{/admin/employees/create}" th:object="${employee}" method="post">

       <div class="form-group">
        <label for="name" class="font-weight-bold">
         Full Name <span class="text-danger">*</span>
        </label>
        <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Enter employee name">
        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="invalid-feedback d-sm-block">
        </div>
        <small class="form-text text-muted">
         Please enter the full name of the employee (maximum 100 characters)
        </small>
       </div>

       <div class="form-group">
        <label for="email" class="font-weight-bold">
         Email Address <span class="text-danger">*</span>
        </label>
        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="invalid-feedback d-sm-block">
        </div>
        <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="Enter email address">
        <small class="form-text text-muted">
         Please enter a valid email address (maximum 100 characters)
        </small>
       </div>

       <div class="form-group">
        <label for="departmentId" class="font-weight-bold">
         Department
        </label>
        <select class="form-control" id="departmentId" th:field="*{departmentId}">
         <option value="">-- Select Department (Optional) --</option>
         <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}">
         </option>
        </select>
        <small class="form-text text-muted">
         Select the department this employee belongs to (optional)
        </small>
       </div>

       <hr class="my-4">

       <div class="form-group mb-0">
        <button type="submit" class="btn btn-primary btn-icon-split">
         <span class="icon text-white-50">
          <i class="fas fa-save"></i>
         </span>
         <span class="text">Save Employee</span>
        </button>
        <a th:href="@{/admin/employees}" class="btn btn-secondary ml-2">
         <i class="fas fa-times"></i> Cancel
        </a>
       </div>

      </form>
     </div>
    </div>
   </div>
  </div>

 </th:block>

 <th:block layout:fragment="custom-scripts">

 </th:block>

</body>

</html>
