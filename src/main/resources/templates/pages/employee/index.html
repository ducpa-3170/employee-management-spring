<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
 layout:decorate="~{layout/base}">

<head>
 <title layout:title-append=" | Employee List"></title>
 <th:block layout:fragment="custom-css">
 </th:block>
</head>

<body>

 <th:block layout:fragment="content">

  <div class="d-sm-flex align-items-center justify-content-between mb-4" sec:authorize="hasRole('ADMIN')">
   <h1 class="h3 mb-0 text-gray-800">Employee Management</h1>
   <a th:href="@{/admin/employees/create}" class="btn btn-primary btn-icon-split">
    <span class="icon text-white-50">
     <i class="fas fa-plus"></i>
    </span>
    <span class="text">Add Employee</span>
   </a>
  </div>

  <!-- Search Form -->
  <div class="card shadow mb-4">
   <div class="card-body">
    <form th:action="@{/admin/employees}" method="get" class="form-inline">
     <div class="form-group mr-3 mb-2">
      <label for="keyword" class="mr-2">Search:</label>
      <input type="text" class="form-control" id="keyword" name="keyword" th:value="${keyword}"
       placeholder="Search by name or department..." style="min-width: 300px;">
     </div>
     <button type="submit" class="btn btn-primary mb-2 mr-2">
      <i class="fas fa-search"></i> Search
     </button>
     <a th:href="@{/admin/employees}" class="btn btn-secondary mb-2">
      <i class="fas fa-undo"></i> Reset
     </a>
    </form>
   </div>
  </div>

  <!-- Alert Messages -->
  <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
   <i class="fas fa-check-circle"></i>
   <span th:text="${successMessage}"></span>
   <button type="button" class="close" data-dismiss="alert" aria-label="Close">
    <span aria-hidden="true">&times;</span>
   </button>
  </div>

  <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
   <i class="fas fa-exclamation-triangle"></i>
   <span th:text="${errorMessage}"></span>
   <button type="button" class="close" data-dismiss="alert" aria-label="Close">
    <span aria-hidden="true">&times;</span>
   </button>
  </div>

  <div class="row">
   <div class="col-12">
    <div class="card shadow mb-4">
     <div class="card-header py-3">
      <h6 class="m-0 font-weight-bold text-primary">List Employees</h6>
     </div>
     <div class="card-body">
      <div class="table-responsive">
       <table class="table table-bordered table-hover" id="employeeTable" width="100%" cellspacing="0">
        <thead>
         <tr class="bg-light">
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Department</th>
          <th sec:authorize="hasRole('ADMIN')">Actions</th>
         </tr>
        </thead>
        <tbody>

         <tr th:each="emp : ${employees}">

          <td th:text="${emp.id}"></td>
          <td th:text="${emp.name}"></td>
          <td th:text="${emp.email}"></td>
          <td th:text="${emp.departmentName}"></td>
          <td sec:authorize="hasRole('ADMIN')">
           <a th:href="@{/admin/employees/edit/{id}(id=${emp.id})}" class="btn btn-sm btn-info">Edit</a>

           <div class="d-inline">
            <form th:action="@{/admin/employees/delete/{id}(id=${emp.id})}" method="post" class="d-inline"
             onsubmit="return confirm('Do you want to delete this employee?');">
             <button type="submit" class="btn btn-sm btn-danger">
              Delete
             </button>
            </form>
           </div>
          </td>
         </tr>
        </tbody>
       </table>
      </div>
     </div>
    </div>
   </div>
  </div>
 </th:block>

 <th:block layout:fragment="custom-scripts">
 </th:block>

</body>

</html>
